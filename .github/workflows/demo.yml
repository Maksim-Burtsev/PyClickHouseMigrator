name: Demo GIF

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - demo/**
      - .github/workflows/demo.yml

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render assets/demo.gif
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 19000:9000
        env:
          CLICKHOUSE_DB: test
          CLICKHOUSE_USER: default
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install migrator
        run: |
          uv sync --dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Wait for ClickHouse service
        run: |
          probe="from clickhouse_driver import Client; Client.from_url('clickhouse://default@localhost:19000/test').execute('SELECT 1')"
          for i in $(seq 1 30); do
            if .venv/bin/python -c "$probe" 2>/dev/null; then
              echo "ClickHouse ready"
              exit 0
            fi
            echo "Waiting for ClickHouse... ($i/30)"
            sleep 2
          done
          echo "ClickHouse service did not become ready" >&2
          exit 1

      - name: Render tape
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo/demo.tape

      - name: Upload GIF
        uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: assets/demo.gif
          if-no-files-found: error

      - name: Summary
        run: |
          echo "Rendered \`assets/demo.gif\` (\`$(du -h assets/demo.gif | cut -f1)\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the **demo-gif** artifact above, drop it into \`assets/\`, and open a PR to update the README GIF." >> "$GITHUB_STEP_SUMMARY"
