name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: wemake-python-styleguide
        run: uv run flake8 .
      - name: mypy
        run: uv run mypy
      - name: no comments
        run: uv run python scripts/check_no_comments.py

  test:
    # Keep this name stable: the master ruleset requires these exact check
    # names. The ClickHouse version is reported by the step below instead.
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            clickhouse: "24.8"
          - python-version: "3.12"
            clickhouse: "25.3"
          - python-version: "3.13"
            clickhouse: "latest"
          - python-version: "3.14"
            clickhouse: "latest"

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        ports:
          - 19000:9000
        env:
          CLICKHOUSE_DB: test
          CLICKHOUSE_USER: default
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev

      - name: Wait for ClickHouse service
        run: |
          uv run python - <<'PY'
          import time

          from clickhouse_driver import Client

          database_url = "clickhouse://default@localhost:19000/test"
          last_error = None

          for attempt in range(30):
              client = None
              try:
                  client = Client.from_url(database_url)
                  client.execute("SELECT 1")
                  print("ClickHouse ready")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Waiting for ClickHouse... ({attempt + 1}/30): {exc}")
                  time.sleep(2)
              finally:
                  if client is not None:
                      client.disconnect()
          else:
              raise SystemExit(f"ClickHouse service did not become ready: {last_error}")
          PY

      - name: Run tests (ClickHouse ${{ matrix.clickhouse }})
        run: uv run pytest -v --cov=py_clickhouse_migrator --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: "python-${{ matrix.python-version }}-ch-${{ matrix.clickhouse }}"
          token: ${{ secrets.CODECOV_TOKEN }}

  test-cluster:
    name: Test (Cluster)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --dev

      - name: Start ClickHouse cluster
        run: docker compose -f docker-compose.cluster.yml up -d --wait

      - name: Wait for cluster to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.cluster.yml exec -T clickhouse-01 \
              clickhouse-client --query "SELECT count() FROM system.clusters WHERE cluster = 'test_cluster'" 2>/dev/null | grep -q "1"; then
              echo "Cluster ready"
              break
            fi
            echo "Waiting for cluster... ($i/30)"
            sleep 2
          done

      - name: Run cluster tests
        run: uv run pytest tests/ -m cluster -v --cov=py_clickhouse_migrator --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: cluster
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop cluster
        if: always()
        run: docker compose -f docker-compose.cluster.yml down
