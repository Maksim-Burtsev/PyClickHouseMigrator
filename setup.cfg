[flake8]
format = wemake
show-source = true
statistics = false
select = WPS, E999
extend-exclude = .venv
per-file-ignores =
  py_clickhouse_migrator/__init__.py: WPS410, WPS412
  py_clickhouse_migrator/checksum.py: WPS110
  py_clickhouse_migrator/errors.py: WPS202
  py_clickhouse_migrator/lock.py: WPS211, WPS214
  py_clickhouse_migrator/migrator.py: WPS111, WPS211, WPS214
  tests/*.py: WPS202, WPS211, WPS226
