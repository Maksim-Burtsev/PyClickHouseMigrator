[project]
name = "py-clickhouse-migrator"
version = "2.1.0"
description = "SQL-first ClickHouse schema migration CLI for Python with checksums, rollback, dry-run, advisory locking, and cluster support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Maksim Burtsev", email = "zadrot-lol@list.ru" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Environment :: Console",
    "Typing :: Typed",
]
keywords = [
    "clickhouse",
    "clickhouse-migrations",
    "database-migrations",
    "cli",
    "cluster",
    "schema-migrations",
    "sql-migrations",
    "migration-tool",
    "python",
    "ci-cd",
    "advisory-locking",
]
dependencies = [
    "click>=8.0.1",
    "clickhouse-driver>=0.2.0",
]

[project.scripts]
migrator = "py_clickhouse_migrator.cli:main"

[project.urls]
Homepage = "https://github.com/Maksim-Burtsev/PyClickHouseMigrator"
Documentation = "https://maksim-burtsev.github.io/PyClickHouseMigrator/"
Repository = "https://github.com/Maksim-Burtsev/PyClickHouseMigrator"
Issues = "https://github.com/Maksim-Burtsev/PyClickHouseMigrator/issues"
Changelog = "https://github.com/Maksim-Burtsev/PyClickHouseMigrator/blob/master/CHANGELOG.md"
Docker = "https://hub.docker.com/r/maksimburtsev/py-clickhouse-migrator"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-sugar>=1.0",
    "ruff>=0.15",
    "pre-commit>=4.0",
    "mypy>=1.19.1",
    "wemake-python-styleguide>=1.8.1",
]
docs = [
    "zensical==0.0.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"
preview = true

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # mccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
  "YTT",  # flake8-2020
]
ignore = [
  "D100",    # module docstrings are optional
  "D104",    # package docstrings are optional
  "D106",    # nested class docstrings are optional
  "D203",    # conflicts with D211
  "D212",    # conflicts with D213
  "D401",    # docstring mood is not enforced
  "D404",    # docstrings may start with "This"
  "D405",    # section name capitalization is not enforced
  "D418",    # @overload may have a docstring
  "ISC001",  # conflicts with ruff format
  "ISC003",  # conflicts with WPS326 (implicit string concatenation)
  "PLR09",   # complexity limits are enforced by wemake-python-styleguide
  "PLR2004", # magic numbers are enforced by WPS432
  "PLR6301", # methods may skip @staticmethod
  "TRY003",  # exceptions take their message at the raise site
]
external = ["WPS"]

[tool.ruff.lint.per-file-ignores]
"py_clickhouse_migrator/lock.py" = ["S608"]
"py_clickhouse_migrator/migrator.py" = ["FBT001", "FBT002"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-import-conventions]
aliases = { datetime = "dt" }
banned-from = ["ast", "datetime"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["py_clickhouse_migrator", "tests", "scripts"]
strict = true
warn_unreachable = true
strict_equality_for_none = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "clickhouse_driver.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not cluster'"
markers = [
    "cluster: tests requiring 2-node ClickHouse cluster (run with pytest -m cluster)",
]
